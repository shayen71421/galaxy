name: ChromeDriver diagnostics

on:
  push:
    branches: [debug/chromedriver-logs]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    if: github.repository == 'shayen71421/galaxy'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: galaxy root
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: galaxy root
          persist-credentials: false
      - name: Install uv and Python 3.11
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version-file: galaxy root/.tool-versions
          python-version: '3.11'
          prune-cache: true
      - name: Install unit test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get -y install ffmpeg bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          uv tool install tox --with tox-uv
      - name: Record runner and browser versions
        run: |
          mkdir -p chromedriver-logs
          {
            uname -a
            free -h
            df -h . /dev/shm
            google-chrome --version
            chromedriver --version
          } 2>&1 | tee chromedriver-logs/environment.log
      - name: Run the Python 3.11 unit suite with four workers
        run: |
          set -o pipefail
          tox -e unit -x 'testenv.pass_env+=SE_DEBUG' 2>&1 | tee chromedriver-logs/unit-tests.log
        env:
          # Keep driver startup stderr visible in the job log and uploaded artifact.
          PYTEST_ADDOPTS: -n 4 --capture=no
          SE_DEBUG: '1'
      - name: Upload driver logs and unit test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chromedriver-diagnostics
          path: |
            galaxy root/chromedriver-logs/
            galaxy root/run_unit_tests.html
          if-no-files-found: warn
          retention-days: 7
